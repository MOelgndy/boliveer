# Render Blueprint — https://dashboard.render.com/blueprints
# 1) Push this repo to GitHub
# 2) Render → New → Blueprint → select repo
# 3) Set NEXT_PUBLIC_SITE_URL to the service URL (e.g. https://boliveer-web.onrender.com)
services:
  - type: web
    name: boliveer-web
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_FLAG_COMMAND_PALETTE
        value: "1"
      - key: NEXT_PUBLIC_FLAG_BOOT
        value: "1"
      - key: NEXT_PUBLIC_FLAG_NEWSLETTER
        value: "1"
      - key: NEXT_PUBLIC_FLAG_BOOKING
        value: "0"
      - key: NEXT_PUBLIC_AB_HOME_HERO
        value: control
      - key: CONTENT_SOURCE
        value: registry
      - key: FORM_WEBHOOK_URL
        sync: false
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
